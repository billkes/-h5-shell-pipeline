<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>{{APP_NAME}}</title>
    <style>
      :root {
        --safe-top: 0px;
        --safe-bottom: 0px;
        --bg: #fdfbf7;
      }
      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); }
      body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      #app { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app">{{APP_NAME}} shell placeholder</div>
    <script>
      (function () {
        if (window.__{{APP_NAME_LOWER}}Native) return;
        window.__{{APP_NAME_LOWER}}Native = true;

        var pending = Object.create(null);
        var seq = 0;

        window.{{APP_NAME_LOWER}}BridgeCallback = function (id, envelope) {
          var slot = pending[id];
          if (!slot) return;
          delete pending[id];
          if (envelope && envelope.error) {
            var err = new Error(envelope.error.message || 'Native lane error');
            err.code = envelope.error.code || 'UNKNOWN';
            slot.reject(err);
            return;
          }
          slot.resolve((envelope && envelope.data) !== undefined ? envelope.data : envelope);
        };

        function invoke(action, data) {
          return new Promise(function (resolve, reject) {
            var id = 'cb_' + (++seq) + '_' + Date.now();
            pending[id] = { resolve: resolve, reject: reject };
            window.webkit.messageHandlers.{{APP_NAME_LOWER}}Bridge.postMessage({
              id: id,
              action: action,
              data: data || {}
            });
          });
        }

        window.{{APP_NAME_LOWER}}Kit = window.{{APP_NAME_LOWER}}Kit || {};
        window.{{APP_NAME_LOWER}}Kit.lane = {
          call: invoke,
          isNative: function () { return true; }
        };
      })();
    </script>
  </body>
</html>
