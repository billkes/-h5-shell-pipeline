name: {{APP_NAME}}
options:
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
targets:
  {{APP_NAME}}:
    type: application
    platform: iOS
    sources:
      - path: ios/{{APP_NAME}}
    resources:
      - path: ios/{{APP_NAME}}/SeedBundle
      - path: ios/{{APP_NAME}}/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": {{TEAM_ID}}
        PROVISIONING_PROFILE_SPECIFIER: ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": {{PROVISIONING_PROFILE}}
        CODE_SIGN_ENTITLEMENTS: {{APP_NAME}}.entitlements
        INFOPLIST_FILE: ios/{{APP_NAME}}/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: ios/{{APP_NAME}}/Info.plist
      properties:
        CFBundleName: {{APP_NAME}}
        CFBundleDisplayName: {{APP_NAME}}
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
