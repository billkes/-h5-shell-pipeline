<title>{{APP_NAME}}</title>
<script>
(function () {
  function isInputTarget(t) {
    if (!t || !t.tagName) return false;
    var tag = t.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || t.isContentEditable;
  }
  document.addEventListener('contextmenu', function (e) {
    if (!isInputTarget(e.target)) e.preventDefault();
  }, true);
  document.addEventListener('selectstart', function (e) {
    if (!isInputTarget(e.target)) e.preventDefault();
  }, true);
  document.addEventListener('dblclick', function (e) {
    if (!isInputTarget(e.target)) e.preventDefault();
  }, true);
  document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
  }, { passive: false });
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    if (isInputTarget(e.target)) return;
    var now = Date.now();
    if (now - lastTouchEnd < 320) {
      e.preventDefault();
      lastTouchEnd = 0;
    } else {
      lastTouchEnd = now;
    }
  }, { passive: false, capture: true });
})();
</script>

  }

  /* store adapter */
  U.store = {
    get: function (k, fallback) {
      try {
        var v = localStorage.getItem(k);
        if (v == null) return fallback;
        return JSON.parse(v);
      } catch (e) { return fallback; }
    },
    set: function (k, v) {
      localStorage.setItem(k, JSON.stringify(v));
      U.bus.emit('store:' + k, v);

  U.bus = {
    _h: {},
    on: function (e, fn) { (this._h[e] = this._h[e] || []).push(fn); },
    emit: function (e, p) { (this._h[e] || []).forEach(function (fn) { try { fn(p); } catch (err) {} }); }
  };

  var pendingCb = {};
  var bridgeAsyncActions = {
    pickImage: 1,
    pickCamera: 1,
    pickGallery: 1,
    saveImage: 1,
    saveImageToAlbum: 1,
    writeFile: 1,
    readFile: 1,
    purchase: 1,
    restorePurchases: 1

  function bridgeCall(action, payload) {
    payload = payload || {};
    var id = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 9999);

    payload.callbackId = id;
    return new Promise(function (resolve) {
      pendingCb[id] = resolve;
      try {
        if (window.{{PREFIX}}Native && window.{{PREFIX}}Native.call) window.{{PREFIX}}Native.call(action, payload);
        else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.{{PREFIX}}) {
          window.webkit.messageHandlers.{{PREFIX}}.postMessage(payload);
        } else {
          resolve({ code: 0, mock: true, payload: payload });

      } catch (e) {
        resolve({ code: -1, message: String(e) });
      }
      if (!bridgeAsyncActions[action]) {
        setTimeout(function () {
          if (pendingCb[id]) { resolve({ code: 0, mock: true }); delete pendingCb[id]; }
        }, 12000);
      }
    });
  }
  U.bridge = { call: bridgeCall };

  function mediaLocalUrl(relPath) {
    if (!relPath) return '';
    return '{{ASSET_SCHEME}}://local/' + String(relPath).replace(/^\/+/, '');
  }
  U.mediaLocalUrl = mediaLocalUrl;

  function drawSketchPhoto(canvas, relPath) {
    return new Promise(function (resolve, reject) {
      if (!canvas || !relPath) { reject(new Error('missing')); return; }
      var ctx = canvas.getContext('2d');
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        var cw = canvas.width, ch = canvas.height;
        ctx.clearRect(0, 0, cw, ch);
        var scale = Math.min(cw / img.width, ch / img.height);
        var dw = img.width * scale, dh = img.height * scale;
        ctx.drawImage(img, (cw - dw) / 2, (ch - dh) / 2, dw, dh);

    if (!block || block.length > 72) return false;

  function formatLegalBody(raw) {
    var lines = String(raw || '').split('\n');
    var title = (lines[0] || '').trim();
    var i = 1;
    while (i < lines.length && !lines[i].trim()) i += 1;
    var meta = '';
    if (i < lines.length && /^Latest Updated:/i.test(lines[i].trim())) {
      meta = lines[i].trim();
      i += 1;
    }
    var blocks = [];
    var current = [];
    for (; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) {
        if (current.length) {
          blocks.push(current.join(' '));
          current = [];
        }
        continue;
      }
      current.push(line);
    }
    if (current.length) blocks.push(current.join(' '));

    var bodyHtml = '';
    if (meta) {
      bodyHtml += '<p class="c-{{PREFIX}}-legal-meta">' + escapeHtml(meta) + '</p>';
    }
    for (var b = 0; b < blocks.length; b++) {
      var block = blocks[b];
      if (isLegalSectionHeading(block)) {
        bodyHtml += '<h2 class="c-{{PREFIX}}-legal-section">' + escapeHtml(block) + '</h2>';
      } else {
        bodyHtml += '<p class="c-{{PREFIX}}-legal-para">' + escapeHtml(block) + '</p>';
      }

    return { title: title, bodyHtml: bodyHtml };

    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + ' · ' + time;

      search = qi >= 0 ? h.slice(qi) : '';
    }
    var params = {};
    if (search.charAt(0) === '?') {
      search.slice(1).split('&').forEach(function (pair) {
        var a = pair.split('=');
        if (a[0]) params[decodeURIComponent(a[0])] = decodeURIComponent(a[1] || '');
      });
    }
    return { path: path, params: params };
  }

        var parts = to.split('?');
        path = parts[0];
        parts[1].split('&').forEach(function (pair) {
          var a = pair.split('=');
          if (a[0]) params[decodeURIComponent(a[0])] = decodeURIComponent(a[1] || '');
        });
      }
      var cur = parseLocation();
      /* Hub is one-shot entry: leaving /home replaces history so Tab roots become home. */
      if (cur.path === '/home' && path !== '/home') replace = true;
      /* Tab roots never push — avoids back-stack pollution (brain: h5-hash-router-tab-nav). */
      if (replace !== true && replace !== false && isTabRoot(path)) replace = true;
      if (isTabRoot(path)) rememberTab(path);
      if (!replace && U.isOverlayPath(path)) {
        var curPath = cur.path;

      } else if (!U.isOverlayPath(path)) {

      var dir = tabSwitch ? (TAB_ROOTS.indexOf(path) - TAB_ROOTS.indexOf(prevPath)) : 0;
      var reduced = {{PREFIX}}ReducedMotion();

      var mount = function (html, mountPath, mountParams, mountOpts, stacked) {
        syncAmbientScene(path);

          stage.innerHTML = html;

          U.afterMount(mountPath, mountParams, mountOpts || {});

          U.afterMount(mountPath, mountParams, mountOpts || {});
        }
        syncTabBar(path);
        requestAnimationFrame(function () { syncTabBar(path); });
        this._lastPath = path;
      }.bind(this);

      if (U.isOverlayPath(path)) {
        var base = this.resolveOverlayBase(path);
        mount(
          U.render(base.path, base.params) + U.render(path, loc.params),
          { basePath: base.path, baseParams: base.params, overlayPath: path, overlayParams: loc.params },
          null,
          null,
          true
        );

      }

      mount(U.render(path, loc.params), path, loc.params, {}, false);
    },
    start: function () {

      ensureTabBar();
      bindNavDelegation();
      window.addEventListener('popstate', function () { self.dispatch(); });
      ensureSeed();
      var welcome = U.store.get('welcome_accepted_v1', false);
      var loc = parseLocation();
      if (loc.path === '/splash' || loc.path === '/' || loc.path.endsWith('{{PREFIX}}_entry.htm')) {
        history.replaceState({}, '', '/splash');
      }
      this.dispatch();
    }
  };

  function showBarrier(text) {
    hideBarrier(true);
    var el = document.createElement('div');
    el.className = 'u-{{PREFIX}}-veil-barrier';
    el.id = '{{PREFIX}}-barrier';
    el.innerHTML = '<div class="c-{{PREFIX}}-barrier-card"><div class="c-{{PREFIX}}-spinner" role="status" aria-label="Loading"></div><p>' + escapeHtml(text || 'Processing…') + '</p></div>';
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('is-in'); });
  }
  function hideBarrier(instant) {
    var el = document.getElementById('{{PREFIX}}-barrier');
    if (!el) return;
    if (instant || {{PREFIX}}ReducedMotion()) {
      el.remove();
      return;
    }
    el.classList.remove('is-in');
    el.classList.add('is-out');
    setTimeout(function () { if (el.parentNode) el.remove(); }, 180);
  }

  function setSketchSaveBusy(active) {
    var save = document.getElementById('{{PREFIX}}-save-sketch');
    var page = document.querySelector('.u-{{PREFIX}}-page--sketch');
    if (page) page.classList.toggle('is-saving', !!active);
    if (save) {
      if (active) {
        if (!save.dataset.idleHtml) save.dataset.idleHtml = save.innerHTML;
        save.classList.add('is-saving');
        save.setAttribute('aria-busy', 'true');
        save.innerHTML = '<span class="c-{{PREFIX}}-spinner c-{{PREFIX}}-spinner--inline" role="status" aria-label="Saving"></span><span>Saving marks…</span>';
      } else {
        save.classList.remove('is-saving');
        save.removeAttribute('aria-busy');
        if (save.dataset.idleHtml) {
          save.innerHTML = save.dataset.idleHtml;
          delete save.dataset.idleHtml;
        }
      }
    }
    ['{{PREFIX}}-cam', '{{PREFIX}}-gal'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.disabled = !!active;
    });
  }

  function ambientSceneForPath(path) {
    if (path === '/splash') return 'splash';
    if (path === '/welcome') return 'welcome';
    if (path === '/paths' || path.indexOf('/paths/') === 0) return 'paths';
    if (path === '/practice' || path.indexOf('/practice/') === 0) return 'practice';
    if (path === '/lookup') return 'lookup';
    if (path.indexOf('/pose/') === 0) return 'sketch';
    if (path === '/store') return 'store';
    if (path === '/export') return 'export';
    if (path === '/settings' || path === '/home' || path === '/plaza' || path === '/legal') return 'hub';
    return 'default';
  }

  function syncAmbientScene(path) {
    document.documentElement.setAttribute('data-{{PREFIX}}-scene', ambientSceneForPath(path));
  }

  function mountStorePage() {
    var page = document.querySelector('.u-{{PREFIX}}-page--store');
    if (!page || page.classList.contains('is-mounted')) return;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { page.classList.add('is-mounted'); });
    });
  }

  function triggerStoreCardShine(el) {
    if (!el || {{PREFIX}}ReducedMotion()) return;
    el.classList.remove('is-shine');
    void el.offsetWidth;
    el.classList.add('is-shine');
    setTimeout(function () { el.classList.remove('is-shine'); }, 560);
  }

  function playStorePurchaseSuccess() {
    var balEl = document.getElementById('{{PREFIX}}-store-balance');
    if (balEl && !{{PREFIX}}ReducedMotion()) {
      balEl.classList.add('is-held');
      setTimeout(function () { balEl.classList.remove('is-held'); }, 480);
    }
  }

  function revealVeilDialogs() {
    document.querySelectorAll('.u-{{PREFIX}}-veil-dialog').forEach(function (el) {
      if ({{PREFIX}}ReducedMotion()) {
        el.classList.add('is-in');
        return;
      }
      requestAnimationFrame(function () { el.classList.add('is-in'); });
    });
  }

  function dismissOverlay(wrap, done) {
    if (!wrap || !wrap.parentNode) {
      if (done) done();
      return;
    }
    if ({{PREFIX}}ReducedMotion()) {
      wrap.remove();
      if (done) done();
      return;
    }
    wrap.classList.remove('is-in');
    wrap.classList.add('is-out');
    setTimeout(function () {
      if (wrap.parentNode) wrap.remove();
      if (done) done();
    }, 180);
  }

  function confirmDialog(title, body, onOk) {
    var wrap = document.createElement('div');
    wrap.className = 'u-{{PREFIX}}-veil-dialog';
    wrap.innerHTML = '<div class="c-{{PREFIX}}-dialog">' + mark('{{PREFIX}}-mark-warn') + '<h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(body) + '</p><div class="c-{{PREFIX}}-dialog__actions">' +
      '<button type="button" class="c-{{PREFIX}}-tap" id="{{PREFIX}}-c-ok">Confirm</button>' +
      '<button type="button" class="c-{{PREFIX}}-tap c-{{PREFIX}}-tap--ghost" id="{{PREFIX}}-c-cancel">Cancel</button></div></div>';
    document.body.appendChild(wrap);
    requestAnimationFrame(function () { wrap.classList.add('is-in'); });
    wrap.querySelector('#{{PREFIX}}-c-cancel').onclick = function () { dismissOverlay(wrap); };
    wrap.querySelector('#{{PREFIX}}-c-ok').onclick = function () { dismissOverlay(wrap, onOk); };
  }

  function bindNavDelegation() {
    var root = document.getElementById('{{PREFIX}}-root');
    if (!root || root._{{PREFIX}}NavBound) return;
    root._{{PREFIX}}NavBound = true;
    root.addEventListener('click', function (ev) {
      var backEl = ev.target.closest('[data-nav-back]');
      if (backEl && root.contains(backEl)) {
        ev.preventDefault();
        history.back();
        return;
      }
      var el = ev.target.closest('[data-nav]');
      if (!el || !root.contains(el)) return;
      ev.preventDefault();
      var to = el.getAttribute('data-nav');
      if (to === 'BACK') history.back();
      else {
        var pathOnly = to.indexOf('?') >= 0 ? to.split('?')[0] : to;
        var useReplace = isTabRoot(pathOnly);
        U.router.navigate(to, useReplace ? true : undefined);
      }
    });
  }

  U.afterMount = function (path, params, opts) {
    opts = opts || {};
    if (opts.stackedBase) return;
    if (path === '/splash' && !opts.stackedOverlay) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          syncSafeArea(true);
          U.bridge.call('shellReady', {}).then(function () {
            syncSafeArea(false);
            var ok = U.store.get('welcome_accepted_v1', false);
            U.router.navigate(ok ? '/home' : '/welcome', true);
          });
        });
      });
    }

    if (path === '/welcome') {
      var box = document.getElementById('{{PREFIX}}-agree');
      var cta = document.getElementById('{{PREFIX}}-welcome-cta');
      if (box && cta) {
        box.addEventListener('change', function () { cta.disabled = !box.checked; });
        cta.addEventListener('click', function () {
          if (!box.checked) return;
          U.store.set('welcome_accepted_v1', true);
          U.router.navigate('/home', true);
        });
      }
    }

    if (path === '/paths') {
      document.querySelectorAll('[data-paths-filter]').forEach(function (el) {
        el.addEventListener('click', function () {
          U.pathsFilter = el.getAttribute('data-paths-filter') || 'all';
          document.querySelectorAll('[data-paths-filter]').forEach(function (chip) {
            chip.classList.toggle('is-on', chip === el);
          });
          refreshPathsView();
        });
      });
    }

    if (path === '/practice') {
      var exportLocked = document.getElementById('{{PREFIX}}-export-locked');
      if (exportLocked) exportLocked.addEventListener('click', function () {
        snack('Log a practice session first', true);
      });
    }

    if (path === '/practice/compose') {
      mountSchoolAutocomplete('{{PREFIX}}-school-search', '{{PREFIX}}-school-ac');
      ['{{PREFIX}}-minutes', '{{PREFIX}}-notes', '{{PREFIX}}-mile'].forEach(function (id) {
        inputDeflavor(document.getElementById(id));
      });
      var btn = document.getElementById('{{PREFIX}}-save-practice');
      if (btn) btn.addEventListener('click', function () {
        var schoolId = schoolInputValue(document.getElementById('{{PREFIX}}-school-search'));
        var minutes = parseInt((document.getElementById('{{PREFIX}}-minutes') || {}).value || '0', 10);
        if (!schoolId || !minutes) { snack('Enter practice minutes', true); return; }
        var list = U.store.get('{{PREFIX}}_practice_v1', []);
        list.push({
          entryId: 'pe_' + Date.now(),
          schoolId: schoolId,
          minutes: minutes,
          notes: (document.getElementById('{{PREFIX}}-notes') || {}).value || '',
          milestoneLabel: (document.getElementById('{{PREFIX}}-mile') || {}).value || '',
          practicedAt: new Date().toISOString(),
          poseId: null
        });
        U.store.set('{{PREFIX}}_practice_v1', list);
        var schools = U.store.get('{{PREFIX}}_schools_v1', []);
        schools = schools.map(function (s) {
          if (s.schoolId === schoolId || s.name === schoolId) {
            s.totalMinutes = (s.totalMinutes || 0) + minutes;
            s.lastPracticedAt = new Date().toISOString();
          }
          return s;
        });
        U.store.set('{{PREFIX}}_schools_v1', schools);
        snack('Saved');
        U.router.navigate('/practice', true);
      });
    }

    if (path.indexOf('/practice/') === 0 && path !== '/practice/compose') {
      var delBtn = document.getElementById('{{PREFIX}}-delete-session');
      if (delBtn) delBtn.addEventListener('click', function () {
        var eid = delBtn.getAttribute('data-entry');
        confirmDialog('Delete session?', 'This removes the log entry and updates your school minutes.', function () {
          var list = U.store.get('{{PREFIX}}_practice_v1', []);
          var entry = list.find(function (e) { return e.entryId === eid; });
          if (!entry) {
            snack('Session not found', true);
            U.router.navigate('/practice');
            return;
          }
          U.store.set('{{PREFIX}}_practice_v1', list.filter(function (e) { return e.entryId !== eid; }));
          var schools = U.store.get('{{PREFIX}}_schools_v1', []).map(function (s) {
            if (s.schoolId !== entry.schoolId) return s;
            return Object.assign({}, s, {
              totalMinutes: Math.max(0, (s.totalMinutes || 0) - (entry.minutes || 0))
            });
          });
          U.store.set('{{PREFIX}}_schools_v1', schools);
          snack('Session deleted');
          U.router.navigate('/practice');
        });
      });
    }

    if (path === '/lookup') {
      mountSchoolAutocomplete('{{PREFIX}}-lookup-q', '{{PREFIX}}-lookup-ac');
      ['{{PREFIX}}-row-label', '{{PREFIX}}-row-mins'].forEach(function (id) {
        inputDeflavor(document.getElementById(id));
      });
      var add = document.getElementById('{{PREFIX}}-add-row');
      if (add) add.addEventListener('click', function () {
        var label = (document.getElementById('{{PREFIX}}-row-label') || {}).value || '';
        var mins = parseInt((document.getElementById('{{PREFIX}}-row-mins') || {}).value || '0', 10);
        var q = schoolInputValue(document.getElementById('{{PREFIX}}-lookup-q')) || 'General';
        if (!label) { snack('Enter a row label', true); return; }
        var rows = U.store.get('{{PREFIX}}_duration_v1', []);
        rows.push({ rowId: 'dr_' + Date.now(), schoolId: q, label: label, minutes: mins || 0, updatedAt: new Date().toISOString() });
        U.store.set('{{PREFIX}}_duration_v1', rows);
        snack('Saved');
        U.router.dispatch();
      });
    }

    if (path.indexOf('/pose/') === 0) {
      var canvas = document.getElementById('{{PREFIX}}-sketch');
      var wrap = document.getElementById('{{PREFIX}}-canvas-wrap');
      var poseId = path.split('/')[2] || '';
      var pose = U.store.get('{{PREFIX}}_poses_v1', []).find(function (p) { return p.poseId === poseId; });
      var savedMedia = (U.store.get('{{PREFIX}}_pose_media_v1', {}) || {})[poseId] || '';
      var savedSketch = latestSketchForPose(poseId);
      var returnPath = sketchReturnPath(poseId);

      function persistPoseMedia(relPath) {
        var map = U.store.get('{{PREFIX}}_pose_media_v1', {});
        map[poseId] = relPath;
        U.store.set('{{PREFIX}}_pose_media_v1', map);
      }

      function attachSketchPhoto(relPath) {
        if (!canvas || !relPath) return Promise.reject(new Error('missing'));
        return drawSketchPhoto(canvas, relPath).then(function (p) {
          persistPoseMedia(p);
          if (wrap) wrap.classList.add('has-image');
          snack('Photo attached');
        });
      }

      function pickSketchPhoto(source) {
        U.bridge.call('pickImage', { source: source }).then(function (r) {
          if (r.code === 0 && r.path) {
            attachSketchPhoto(r.path).catch(function () {
              snack('Could not load photo', true);
            });
          } else if (r.code !== -2) {
            snack(r.message || (source === 'camera' ? 'Camera unavailable' : 'Gallery unavailable'), true);
          }
        });
      }

      function restoreSketchCanvas() {
        if (!canvas) return;
        var previewPath = (savedSketch && savedSketch.previewPath) || (pose && pose.sketchPreviewPath) || '';
        var refMedia = (savedSketch && savedSketch.mediaPath) || savedMedia || (pose && pose.mediaPath) || '';
        if (previewPath) {
          drawSketchPreview(canvas, previewPath, refMedia).then(function () {
            if (wrap) wrap.classList.add('has-image');
          }).catch(function () {
            if (refMedia) {
              drawSketchPhoto(canvas, refMedia).then(function () {
                if (wrap) wrap.classList.add('has-image');
                snack('Saved marks unavailable — showing reference photo', true);
              }).catch(function () {});
            }
          });
          return;
        }
        if (refMedia) {
          drawSketchPhoto(canvas, refMedia).then(function () {
            if (wrap) wrap.classList.add('has-image');
          }).catch(function () {});
        }
      }

      if (canvas) {
        var ctx = canvas.getContext('2d');
        var drawing = false;
        function pos(ev) {
          var r = canvas.getBoundingClientRect();
          var t = ev.touches ? ev.touches[0] : ev;
          return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
        }
        function start(ev) { drawing = true; var p = pos(ev); ctx.beginPath(); ctx.moveTo(p.x, p.y); ev.preventDefault(); }
        function move(ev) { if (!drawing) return; var p = pos(ev); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineTo(p.x, p.y); ctx.stroke(); ev.preventDefault(); }
        function end() { drawing = false; }
        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
        canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end);
        restoreSketchCanvas();
      }
      var save = document.getElementById('{{PREFIX}}-save-sketch');
      if (save) save.addEventListener('click', function () {
        if (save.classList.contains('is-saving')) return;
        if (!canvas) { snack('Canvas unavailable', true); return; }
        var mediaPath = canvas.dataset.mediaPath || savedMedia || (savedSketch && savedSketch.mediaPath) || '';
        if (!mediaPath && !savedSketch) {
          snack('Load a reference photo first', true);
          return;
        }
        setSketchSaveBusy(true);
        showBarrier('Saving marks…');
        var finishSave = function (ok, msg) {
          hideBarrier();
          setSketchSaveBusy(false);
          if (msg) snack(msg, !ok);
        };
        requestAnimationFrame(function () {
          var timed = new Promise(function (resolve, reject) {
            var timer = setTimeout(function () { reject(new Error('timeout')); }, 15000);
            saveSketchMarks(canvas, poseId, mediaPath).then(function (v) {
              clearTimeout(timer);
              resolve(v);
            }).catch(function (e) {
              clearTimeout(timer);
              reject(e);
            });
          });
          timed.then(function (previewPath) {
            if (!previewPath) {
              finishSave(false, 'Could not save marks');
              return;
            }
            finishSave(true, 'Marks saved');
            U.router.navigate(returnPath);
          }).catch(function (err) {
            var msg = 'Could not save marks';
            if (err && err.message === 'timeout') msg = 'Save timed out — try again';
            else if (err && err.message === 'canvas_blocked') {
              msg = 'Could not export marks — reload the photo and try again';
            }
            finishSave(false, msg);
          });
        });
      });
      var cam = document.getElementById('{{PREFIX}}-cam');
      if (cam) cam.addEventListener('click', function () { pickSketchPhoto('camera'); });
      var gal = document.getElementById('{{PREFIX}}-gal');
      if (gal) gal.addEventListener('click', function () { pickSketchPhoto('gallery'); });
    }

    if (path === '/export') {
      document.querySelectorAll('[data-grad]').forEach(function (el) {
        el.addEventListener('click', function () {
          var key = el.getAttribute('data-grad');
          U.store.set('export_gradient_v1', GRAD_PRESETS[key] || GRAD_PRESETS.cool);
          U.store.set('export_grad_key_v1', key);
          U.router.dispatch();
        });
      });
      var ex = document.getElementById('{{PREFIX}}-do-export');
      if (ex) ex.addEventListener('click', function () {
        if (ex.classList.contains('is-busy')) return;
        var free = U.store.get('free_remaining_v1', 0);
        var run = function () {
          var card = document.getElementById('{{PREFIX}}-export-card');
          ex.classList.add('is-busy');
          if (card) card.classList.add('is-exporting');
          showBarrier('Rendering sheet…');
          var practice = U.store.get('{{PREFIX}}_practice_v1', []);
          var g = U.store.get('export_gradient_v1', GRAD_PRESETS.cool);
          var finish = function (ok) {
            hideBarrier();
            ex.classList.remove('is-busy');
            if (card) card.classList.remove('is-exporting');
            if (ok) {
              playExportSuccess();
              snack('Saved to Photos');
            } else snack('Could not save — try again', true);
          };
          var save = function () {
            var b64 = rasterizeExportCard(g, practice);
            var rel = 'exports/week_' + Date.now() + '.png';
            U.bridge.call('writeFile', { path: rel, base64: b64 }).then(function () {
              return U.bridge.call('saveImageToAlbum', { path: rel });
            }).then(function (r) {
              finish(r && r.code === 0);
            }).catch(function () { finish(false); });
          };
          if ({{PREFIX}}ReducedMotion()) {
            save();
          } else {
            setTimeout(save, 420);
          }
        };
        if (free > 0) {
          U.store.set('free_remaining_v1', free - 1);
          run();
        } else {
          var bal = U.store.get('coin_balance_v1', 0);
          if (bal < 40) {
            confirmDialog('Insufficient coins', 'You need 40 coins to export.', function () { U.router.navigate('/store'); });
            return;
          }
          confirmDialog('Spend 40 coins?', 'Export this weekly sheet for 40 coins.', function () {
            U.store.set('coin_balance_v1', bal - 40);
            run();
          });
        }
      });
    }

    if (path === '/store' || document.querySelector('[data-buy]')) {
      if (path === '/store') mountStorePage();
      document.querySelectorAll('[data-buy]').forEach(function (el) {
        el.addEventListener('click', function () {
          if (el.classList.contains('is-loading')) return;
          var pid = el.getAttribute('data-buy');
          var coins = parseInt(el.getAttribute('data-coins') || '0', 10);
          el.classList.add('is-loading');
          triggerStoreCardShine(el);
          showBarrier('Processing purchase…');
          U.bridge.call('purchase', { productId: pid }).then(function (r) {
            hideBarrier();
            el.classList.remove('is-loading');
            if (r && (r.code === 0 || r.mock)) {
              U.store.set('coin_balance_v1', U.store.get('coin_balance_v1', 0) + coins);
              playStorePurchaseSuccess();
              snack('Purchase complete');
              setTimeout(function () { U.router.dispatch(); }, {{PREFIX}}ReducedMotion() ? 0 : 400);
            } else if (r && r.code === -2) {
              snack('Purchase cancelled', true);
            } else {
              snack('Purchase failed', true);
            }
          });
        });
      });
    }

    if (path === '/settings') {
      var unlock = document.getElementById('{{PREFIX}}-unlock-accent');
      if (unlock) unlock.addEventListener('click', function () {
        var bal = U.store.get('coin_balance_v1', 0);
        if (bal < 120) {
          confirmDialog('Insufficient coins', 'Unlock accents for 120 coins.', function () { U.router.navigate('/store'); });
          return;
        }
        confirmDialog('Unlock accents?', 'Spend 120 coins to unlock custom accent colors.', function () {
          U.store.set('coin_balance_v1', bal - 120);
          U.store.set('accent_unlocked_v1', true);
          snack('Accent unlocked');
          U.router.dispatch();
        });
      });
      document.querySelectorAll('[data-accent]').forEach(function (el) {
        el.addEventListener('click', function () {
          document.querySelectorAll('[data-accent]').forEach(function (s) { s.classList.remove('is-on'); });
          el.classList.add('is-on');
          document.documentElement.style.setProperty('--{{PREFIX}}-primary', el.getAttribute('data-accent'));
          U.store.set('accent_color_v1', el.getAttribute('data-accent'));
          snack('Accent applied');
        });
      });
      var ver = document.getElementById('{{PREFIX}}-version');
      if (ver) {
        var timer = null;
        ver.addEventListener('touchstart', function () {
          timer = setTimeout(function () { U.router.navigate('/plaza'); }, 3000);
        });
        ver.addEventListener('touchend', function () { clearTimeout(timer); });
        ver.addEventListener('mousedown', function () {
          timer = setTimeout(function () { U.router.navigate('/plaza'); }, 3000);
        });
        ver.addEventListener('mouseup', function () { clearTimeout(timer); });
      }
    }

    if (path === '/plaza') {
      U._plazaLastImagePath = U._plazaLastImagePath || '';
      document.querySelectorAll('[data-plaza]').forEach(function (el) {
        el.addEventListener('click', function () {
          var i = parseInt(el.getAttribute('data-plaza'), 10);
          var b = U._plaza[i];
          var out = document.getElementById('{{PREFIX}}-plaza-out');
          var action = b[1];
          var params = b[2] ? U.cloneParams(b[2]) : {};
          if (action === 'saveImageToAlbum') {
            if (!U._plazaLastImagePath) {
              U._plazaLastImagePath = U.store.get('{{PREFIX}}_plaza_last_path', '') || '';
            }
            if (!U._plazaLastImagePath) {
              var miss = { code: -1, message: 'Pick Camera or Gallery first' };
              if (out) out.textContent = JSON.stringify(miss, null, 2);
              snack('Pick an image first', true);
              return;
            }
            params.path = U._plazaLastImagePath;
          }
          if (out) out.textContent = 'calling ' + action + '…';
          if (action === 'purchase') showBarrier('Processing purchase…');
          U.bridge.call(action, params).then(function (r) {
            if (action === 'purchase') hideBarrier();
            if (out) out.textContent = JSON.stringify(r, null, 2);
            if (r && r.code === 0 && (action === 'pickImage' || action === 'pickCamera' || action === 'pickGallery')) {
              var picked = r.path || (r.payload && r.payload.path) || '';
              if (picked) {
                U._plazaLastImagePath = picked;
                U.store.set('{{PREFIX}}_plaza_last_path', picked);
              }
            }
            snack(r && r.code === 0 ? 'success' : 'error ' + (r && r.code), !(r && r.code === 0));
          });
        });
      });
    }

    if (path === '/legal') {
      document.querySelectorAll('[data-action="legal-close"]').forEach(function (el) {
        el.addEventListener('click', function () { history.back(); });
      });
    }
  };

  function boot() {
    ensureSeed();
    syncSafeArea(true);
    // merge LEGAL if bundled script loaded
    if (window.{{PREFIX}}_kit && window.{{PREFIX}}_kit.ui && window.{{PREFIX}}_kit.ui.LEGAL) {
      U.LEGAL = window.{{PREFIX}}_kit.ui.LEGAL;
    }
    U.router.start();
  }

  window.{{PREFIX}}_kit.ui = U;
  boot();
})();

</script>
<script>
document.addEventListener('error', function (ev) {
  var t = ev.target;
  if (t && t.tagName === 'IMG' && t.getAttribute('data-fallback-mark')) {
    var id = t.getAttribute('data-fallback-mark');
    var span = document.createElement('span');
    span.innerHTML = '<svg class="c-{{PREFIX}}-mark"><use href="#' + id + '"></use></svg>';
    t.replaceWith(span.firstChild);
  }
}, true);
